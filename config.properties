# TorchServe Configuration (Local CPU Deployment)
inference_address=http://0.0.0.0:8090
management_address=http://0.0.0.0:8091
metrics_address=http://0.0.0.0:8092

model_store=model_store
load_models=story_continuation=story_continuation.mar

default_response_timeout=120
number_of_netty_threads=4
job_queue_size=100
disable_token_authorization=true
enable_envvars_config=true

models={\
  "story_continuation": {\
    "1.0": {\
      "defaultVersion": true,\
      "marName": "story_continuation.mar",\
      "minWorkers": 1,\
      "maxWorkers": 1,\
      "batchSize": 1,\
      "maxBatchDelay": 100,\
      "responseTimeout": 120\
    }\
  }\
}
